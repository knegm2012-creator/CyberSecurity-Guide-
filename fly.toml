app = "cs-odyssey"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  HOSTNAME = "0.0.0.0"
  CS_ODYSSEY_DATA_DIR = "/app/.data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[mounts]]
  source = "cs_odyssey_data"
  destination = "/app/.data"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
